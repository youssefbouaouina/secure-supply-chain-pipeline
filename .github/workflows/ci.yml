name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  SYFT_VERSION: v1.56.0
  GRYPE_VERSION: v0.121.1
  CONFTEST_VERSION: v0.71.1
  KUBE_LINTER_VERSION: v0.8.3
  IMAGE_NAME: ghcr.io/youssefbouaouina/secure-supply-chain-pipeline

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar

  supply-chain:
    name: Supply chain, scanning and signing
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build jar and both images
        run: |
          mvn -B -ntp -DskipTests package
          docker build -f Dockerfile.v1 -t app:v1 .
          docker build -f Dockerfile -t app:v2 .

      - name: Install pinned scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"
          curl -sSfL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          install -m 0755 conftest /usr/local/bin/conftest
          curl -sSfL -o kube-linter.tar.gz \
            "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          tar -xzf kube-linter.tar.gz kube-linter
          install -m 0755 kube-linter /usr/local/bin/kube-linter
          syft version
          grype version
          conftest --version
          kube-linter version

      - name: Scan, evaluate policies and apply the CVE gate
        run: bash scripts/scan.sh

      - name: Push hardened image to GHCR
        id: push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag app:v2 "${IMAGE_NAME}:1.0.0"
          docker push "${IMAGE_NAME}:1.0.0"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_NAME}:1.0.0" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed ${IMAGE_NAME}:1.0.0@${digest}"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Keyless signature
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: SLSA build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push: true

      - name: Verify signature and provenance (real output saved)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          cosign verify "${IMAGE_NAME}@${{ steps.push.outputs.digest }}" \
            --certificate-identity-regexp "https://github.com/youssefbouaouina/secure-supply-chain-pipeline/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            | tee results/cosign_verify.json
          gh attestation verify "oci://${IMAGE_NAME}@${{ steps.push.outputs.digest }}" \
            --repo youssefbouaouina/secure-supply-chain-pipeline \
            2>&1 | tee results/attestation_verify.txt

      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-results
          path: results/
